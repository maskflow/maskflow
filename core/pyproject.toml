[project]
name = "maskflow-core"
version = "0.1.0"
description = "PII detection and reversible masking engine for MaskFlow"
requires-python = ">=3.9"
dependencies = [
    "spacy>=3.7,<4",
    "click>=8.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_core"]

[tool.hatch.metadata]
allow-direct-references = true
