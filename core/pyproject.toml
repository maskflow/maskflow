[project]
name = "maskflow-core"
version = "0.1.1"
description = "PII detection and reversible masking engine for MaskFlow"
requires-python = ">=3.9"
dependencies = [
    "spacy>=3.7,<4",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "benchmark: performance / regex-safety checks (opt-in via -m benchmark)",
    "leak: guards against PII reaching logs, exceptions, repr, or test output",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_core"]
