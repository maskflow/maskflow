[project]
name = "maskflow-gateway"
version = "0.1.0"
description = "MaskFlow Gateway: a drop-in OpenAI/Anthropic-compatible proxy that masks PII before it reaches an LLM provider and restores it in the response -- streaming included."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # The masking engine + session identity + snapshot()/restore() (session
    # state across processes) all live in the SDK. 0.7.0 is the first
    # version with Session.snapshot()/restore() and the patterns_only flag
    # the gateway's MASKFLOW_GATEWAY_NER=0 mode needs.
    "maskflow-sdk>=0.7.0,<0.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # One async HTTP client for every upstream (OpenAI, Anthropic, or any
    # compatible endpoint) -- no vendor SDKs, same principle as maskflow-cli.
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
maskflow-gateway = "maskflow_gateway.__main__:main"

[project.optional-dependencies]
# Redis-backed sessions (multi-turn / multi-process). Without this extra the
# gateway still runs, but only with in-process ephemeral sessions -- fine for
# a single-replica non-streaming deployment, not for anything that scales
# out. redis>=5 ships redis.asyncio, so there's no separate aioredis dep.
redis = [
    "redis>=5.0",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "respx>=0.21",
    "fakeredis>=2.23",
    "cryptography>=42",
]
loadtest = [
    "locust>=2.29",
]

[tool.uv.sources]
maskflow-sdk = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "leak: guards against PII reaching logs, error bodies, metrics, or the upstream",
]
