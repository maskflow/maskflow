[project]
name = "maskflow-audit"
version = "0.1.0"
description = "MaskFlow egress audit: find every place a codebase sends text to an LLM, classify whether that path is masked, and prove the unmasked ones leak Indian PII with synthetic canaries. Powers `maskflow audit`."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # discovery/masking.py needs maskflow_core.masking's reserved-token
    # regex to recognise already-masked text, and report/summary.py needs
    # PIIType to name predicted entity types. 0.8.0 is the floor because
    # that is where apply_negative_context() landed (#63) -- the pack
    # versions this package type-checks against require it anyway.
    "maskflow-core>=0.8.0,<0.9",
    # The canary generator (M2) builds on maskflow_pack_india.checksums /
    # .surrogates, and discovery predicts Indian entity types from column
    # names, so the Indian entity types must be registered. Imported for
    # its registration side effect, like maskflow-cli's app.py does.
    # <0.7: admits 0.6.0 (Devanagari names, 5+5 mobiles, spaCy span_filter).
    "maskflow-pack-india>=0.6.0,<0.7",
    # Must be imported BEFORE pack-india (both register PERSON_NAME and the
    # last registration wins) -- see src/maskflow_audit/__init__.py.
    "maskflow-pack-intl>=0.3.2,<0.4",
    # sinks/registry.yaml is the sink registry. YAML rather than TOML or
    # JSON so a contributor adding a sink can leave a comment next to it,
    # which is the whole point of keeping the registry as data.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
maskflow-core = { workspace = true }
maskflow-pack-india = { workspace = true }
maskflow-pack-intl = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_audit"]

[tool.pytest.ini_options]
markers = [
    "leak: guards against source text, discovered values, or canary values reaching the report, logs, or exceptions",
]
