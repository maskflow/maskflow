[project]
name = "maskflow-llamaindex"
version = "0.1.0"
description = "MaskFlow for LlamaIndex: a PII node postprocessor (drop-in for PIINodePostprocessor), an ingestion transform that keeps PII out of the vector store, and a reversible query engine wrapper. Indian identifiers included."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # The masking engine, session identity, and the fuzz-tested
    # StreamingUnmasker (0.8.0 -> maskflow.streaming) the streaming unmask
    # helper is built on.
    "maskflow-sdk>=0.8.0,<0.9",
    # BaseNodePostprocessor, TransformComponent, TextNode, NodeWithScore --
    # a real runtime dependency. In the *workspace* it is only installed by
    # `uv sync --group llama-index` (its dep tree is large: sqlalchemy, nltk,
    # tiktoken, aiohttp, ...), and the provider-agnostic masking logic in
    # _masking.py is tested without it.
    "llama-index-core>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[tool.uv.sources]
maskflow-sdk = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_llamaindex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "leak: guards against PII reaching logs, repr, or node metadata that leaves the process",
    "llamaindex: needs the real llama-index-core package (uv sync --group llama-index)",
]
