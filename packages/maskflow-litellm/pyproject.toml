[project]
name = "maskflow-litellm"
version = "0.1.0"
description = "MaskFlow guardrail for LiteLLM: mask PII (Indian IDs included) before a request reaches the provider, restore it in the response -- streaming and tool calls included."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # The masking engine, session identity (stable token <-> value across
    # turns), Session.snapshot()/restore(), and the fuzz-tested
    # StreamingUnmasker all live in the SDK. 0.8.0 is the first version with
    # maskflow.streaming (StreamingUnmasker moved out of maskflow-gateway).
    "maskflow-sdk>=0.8.0,<0.9",
]

[project.optional-dependencies]
# Cross-turn sessions across LiteLLM proxy workers / replicas. Without this
# the guardrail still keeps token identity stable for one request (mask ->
# unmask always run in the same worker), and for cross-turn identity on a
# single-worker proxy via an in-process TTL store. Redis is only needed when
# the same X-Maskflow-Session id must resolve on a different worker/replica.
redis = [
    "redis>=5.0",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "fakeredis>=2.23",
    "cryptography>=42",
]

[tool.uv.sources]
maskflow-sdk = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_litellm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "leak: guards against PII reaching logs, error messages, repr, or request metadata",
    "litellm: needs the real litellm package (uv run --group litellm pytest)",
]
