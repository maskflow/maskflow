[project]
name = "maskflow-agent"
version = "0.1.2"
description = "MaskFlow guard for AI coding agents: Claude Code hooks that mask PII (Aadhaar, PAN, UPI, mobile, ...) in tool output before the model sees it, and restore values only inside allowlisted commands at run time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Session: stable value -> placeholder identity for a whole agent run,
    # placeholder look-alike reservation, snapshot-free in-memory mapping.
    # Only the daemon imports it -- the hook client is stdlib-only.
    "maskflow-sdk>=0.9.2,<0.10",
]

[project.scripts]
maskflow-agent = "maskflow_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
maskflow-sdk = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_agent"]

[tool.pytest.ini_options]
markers = [
    "leak: guards against PII reaching the model, hook stdout, logs, or disk",
    "e2e: drives a real `claude -p` session (opt-in: MASKFLOW_AGENT_E2E=1)",
]
