[project]
name = "maskflow-sdk"
version = "0.8.0"
description = "Mask PII before it reaches an LLM, unmask the response. Works with any provider."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # maskflow_core.config (RootConfig, resolve_config, compile_config --
    # what mask()/mask_and_call()/session() read .maskflowrc through) only
    # exists from core 0.3.0. 0.6.0 adds maskflow_core.recognizer (issue
    # #21's pluggable interface) -- pack-intl/pack-india now require it, so
    # the floor moves with theirs even though this package doesn't import
    # maskflow_core.recognizer directly.
    "maskflow-core>=0.6.0,<0.7",
    # pack-intl 0.1.0 itself requires core<0.3 (register_surrogate_generator
    # didn't exist yet), unsatisfiable alongside core>=0.3.0 above -- 0.2.0
    # is the first version that requires (and works with) the new core.
    # 0.3.0 migrates registration to declarative Recognizer objects
    # (maskflow_core.recognizer) and adds a "maskflow.recognizers" entry
    # point -- import-time side-effect behavior unchanged (see
    # maskflow/__init__.py), so the existing lower bound logic still holds,
    # it just now requires core>=0.6.0 too.
    "maskflow-pack-intl>=0.3.0,<0.4",
    # Adds AADHAAR/AADHAAR_MASKED/PAN/GSTIN/IFSC/UPI_VPA detection --
    # registered the same side-effect-import way as pack-intl above (see
    # maskflow/__init__.py). 0.2.0 adds INDIAN_MOBILE/PIN_CODE/VOTER_ID/
    # INDIAN_PASSPORT/DRIVING_LICENCE/VEHICLE_REG/ABHA_NUMBER/ABHA_ADDRESS/
    # BANK_ACCOUNT_IN; 0.3.0 adds PERSON_NAME (Indian)/INDIAN_ADDRESS
    # (gazetteer + structural + NLP-agreement layers -- also its own
    # [nlp]/spaCy dependency now, not spaCy-free anymore); 0.4.0 migrates
    # registration to declarative Recognizer objects the same way pack-intl
    # 0.3.0 did, same import-time side effect. All additive only -- no API
    # change, so the existing lower bound still holds.
    "maskflow-pack-india>=0.1.0,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Passthrough so `pip install maskflow-sdk[yaml]` works without needing to
# know the underlying package name -- most users will never write YAML
# config, so this stays opt-in rather than a default dependency.
yaml = [
    "maskflow-core[yaml]",
]

[tool.uv.sources]
maskflow-core = { workspace = true }
maskflow-pack-intl = { workspace = true }
maskflow-pack-india = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow"]
