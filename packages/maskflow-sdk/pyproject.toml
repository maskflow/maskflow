[project]
name = "maskflow-sdk"
version = "0.1.0"
description = "Mask PII before it reaches an LLM, unmask the response. Works with any provider."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # register_ner_recognizer()/register_pattern() plumbing maskflow-pack-intl
    # relies on only exists from core 0.2.0.
    "maskflow-core>=0.2.0,<0.3",
    "maskflow-pack-intl>=0.1.0,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
maskflow-core = { workspace = true }
maskflow-pack-intl = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow"]
