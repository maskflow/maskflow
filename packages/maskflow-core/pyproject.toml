[project]
name = "maskflow-core"
version = "0.1.1"
description = "PII detection and reversible masking engine for MaskFlow"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7,<4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_core"]
