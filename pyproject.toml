[project]
name = "maskflow-workspace"
version = "0.0.0"
description = "MaskFlow uv workspace root -- not published, see packages/* and packs/*"
requires-python = ">=3.9"
# Virtual root: not a real package, but declaring the workspace members here
# is what makes a plain `uv sync` at the repo root actually install all of
# them (editable) into the shared venv -- otherwise nothing in the workspace
# depends on them and uv installs nothing but dev tooling.
dependencies = [
    "maskflow-sdk",
]

[tool.uv.sources]
maskflow-core = { workspace = true }
maskflow-pack-intl = { workspace = true }
maskflow-sdk = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "packs/*"]
exclude = ["packages/maskflow-js"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Installed mypy no longer supports checking against a 3.9 target (dropped in
# recent releases) even though packages/maskflow-core itself still declares
# requires-python = ">=3.9" -- actual 3.9 runtime compatibility is verified by
# ci.yml's real 3.9 interpreter matrix, not by this static-analysis version.
# 3.12 (not 3.10) because numpy's installed stub (pulled in transitively via
# spacy) uses a PEP 695 `type` statement that only parses under a 3.12+
# target -- per-module follow_imports="skip" for spacy/numpy did not avoid
# this (mypy still parses skipped modules' stub files to build their public
# interface), so matching the target version was the reliable fix.
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "spacy"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
markers = [
    "benchmark: performance / regex-safety checks (opt-in via -m benchmark)",
    "leak: guards against PII reaching logs, exceptions, repr, or test output",
]
