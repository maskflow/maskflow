name: Release Gateway

on:
  push:
    tags:
      - "gateway-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packages/maskflow-gateway/tests -q
      - run: uv build --package maskflow-gateway
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  version:
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: echo "v=${GITHUB_REF_NAME#gateway-v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the release to appear on PyPI
        run: |
          for i in $(seq 1 30); do
            if pip index versions maskflow-gateway 2>/dev/null | grep -q "${{ needs.version.outputs.v }}"; then
              exit 0
            fi
            echo "maskflow-gateway ${{ needs.version.outputs.v }} not on PyPI yet (attempt $i)"; sleep 20
          done
          echo "gave up waiting for PyPI"; exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/maskflow-gateway
          file: packages/maskflow-gateway/deploy/Dockerfile
          build-args: MASKFLOW_GATEWAY_VERSION=${{ needs.version.outputs.v }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/maskflow/gateway:${{ needs.version.outputs.v }}
            ghcr.io/maskflow/gateway:latest
      - name: Smoke test the pushed image
        run: |
          IMG=ghcr.io/maskflow/gateway:${{ needs.version.outputs.v }}
          docker run -d --name gw -p 8000:8000 "$IMG"
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/healthz | grep -q ok
          curl -sf localhost:8000/v1/entities | grep -q AADHAAR
          # In-process sessions, no Redis -> readyz is ready.
          curl -sf localhost:8000/readyz | grep -q ready
          docker rm -f gw
