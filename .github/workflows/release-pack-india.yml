name: Release Pack (India)

on:
  push:
    tags:
      - "pack-india-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      # maskflow-pack-india has no [nlp] dependency of its own, but detect()
      # always runs the NER pass regardless of which pack registered which
      # pattern -- uv sync pulls maskflow-core[nlp] transitively via
      # maskflow-sdk, same as the pack-intl/sdk release workflows.
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packs/maskflow-pack-india/tests -q
      - run: uv build --package maskflow-pack-india
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
