name: Release Core

on:
  push:
    tags:
      - "core-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest packages/maskflow-core/tests -q
      - run: uv build --package maskflow-core
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/maskflow-core/dist
          skip-existing: true
