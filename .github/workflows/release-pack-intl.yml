name: Release Pack (Intl)

on:
  push:
    tags:
      - "pack-intl-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packs/maskflow-pack-intl/tests -q
      - run: uv build --package maskflow-pack-intl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packs/maskflow-pack-intl/dist
          skip-existing: true
