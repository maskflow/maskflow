name: Release Detection (JS)

on:
  push:
    tags:
      - "detection-js-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build -w @maskflow/detection
      - run: npm publish --access public -w @maskflow/detection
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
