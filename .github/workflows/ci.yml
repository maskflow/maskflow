name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      pack_intl: ${{ steps.filter.outputs.pack_intl }}
      pack_india: ${{ steps.filter.outputs.pack_india }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      cli: ${{ steps.filter.outputs.cli }}
      detection_js: ${{ steps.filter.outputs.detection_js }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/maskflow-core/**'
              - 'pyproject.toml'
            pack_intl:
              - 'packs/maskflow-pack-intl/**'
              - 'packages/maskflow-core/**'
              - 'pyproject.toml'
            pack_india:
              - 'packs/maskflow-pack-india/**'
              - 'packages/maskflow-core/**'
              # pack-india's cross-pack UPI_VPA-vs-EMAIL test imports
              # maskflow_pack_intl (see tests/test_upi_vpa.py), so a change
              # there can change this job's result too.
              - 'packs/maskflow-pack-intl/**'
              - 'pyproject.toml'
            sdk_python:
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            cli:
              - 'packages/maskflow-cli/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            detection_js:
              - 'packages/maskflow-js/**'
            bench:
              - 'bench/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check packages/maskflow-core
      - run: uv run ruff format --check packages/maskflow-core
      - run: uv run mypy packages/maskflow-core --strict
      - run: >
          uv run pytest packages/maskflow-core/tests -q
          --cov=maskflow_core --cov-report=term-missing --cov-fail-under=85

  pack-intl:
    needs: changes
    if: needs.changes.outputs.pack_intl == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packs/maskflow-pack-intl
      - run: uv run ruff format --check packs/maskflow-pack-intl
      - run: uv run pytest packs/maskflow-pack-intl/tests -q

  pack-india:
    needs: changes
    if: needs.changes.outputs.pack_india == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # maskflow-pack-india has no [nlp] dependency of its own, but
      # detect() always runs the NER pass regardless of which pack
      # registered which pattern -- uv sync pulls maskflow-core[nlp]
      # transitively via maskflow-sdk, same as the pack-intl job above.
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packs/maskflow-pack-india
      - run: uv run ruff format --check packs/maskflow-pack-india
      - run: uv run pytest packs/maskflow-pack-india/tests -q

  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-sdk
      - run: uv run ruff format --check packages/maskflow-sdk
      - run: uv run pytest packages/maskflow-sdk/tests -q

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-cli
      - run: uv run ruff format --check packages/maskflow-cli
      - run: uv run pytest packages/maskflow-cli/tests -q

  benchmark:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # Only ever needs the maskflow adapter -- no presidio/mask-privacy
      # install, no Anthropic key. See bench/indiapii/harness/tests/
      # test_ci_regression.py.
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest bench/indiapii/harness/tests -m benchmark -q
      # Pure/deterministic pieces only (task generation, scoring, cache,
      # pipeline masking against a fake model) -- no Anthropic key needed.
      # The live task-model/judge path (pipeline.py's TaskModel.generate(),
      # judge.py's Judge.score()) is exercised by a manual `run` invocation,
      # same as llm_adapter.py's own network call is never run in CI.
      - run: uv run pytest bench/indiapii/quality/tests -q

  detection-js:
    needs: changes
    if: needs.changes.outputs.detection_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -w @maskflow/detection
      - run: npm test -w @maskflow/detection

  pip-audit:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.pack_intl == 'true' || needs.changes.outputs.pack_india == 'true' || needs.changes.outputs.sdk_python == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv export --no-hashes --all-extras -o requirements.txt
      - run: uvx pip-audit -r requirements.txt
