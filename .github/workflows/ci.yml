name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      detection_js: ${{ steps.filter.outputs.detection_js }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            sdk_python:
              - 'sdk/python/**'
              - 'core/**'
            detection_js:
              - 'packages/detection/**'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest -q

  detection-js:
    needs: changes
    if: needs.changes.outputs.detection_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build -w @maskflow/detection
      - run: npm test -w @maskflow/detection

  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest -q
