name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      pack_intl: ${{ steps.filter.outputs.pack_intl }}
      pack_india: ${{ steps.filter.outputs.pack_india }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      gateway: ${{ steps.filter.outputs.gateway }}
      litellm_guardrail: ${{ steps.filter.outputs.litellm_guardrail }}
      cli: ${{ steps.filter.outputs.cli }}
      cli_docker: ${{ steps.filter.outputs.cli_docker }}
      detection_js: ${{ steps.filter.outputs.detection_js }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/maskflow-core/**'
              - 'pyproject.toml'
            pack_intl:
              - 'packs/maskflow-pack-intl/**'
              - 'packages/maskflow-core/**'
              - 'pyproject.toml'
            pack_india:
              - 'packs/maskflow-pack-india/**'
              - 'packages/maskflow-core/**'
              # pack-india's cross-pack UPI_VPA-vs-EMAIL test imports
              # maskflow_pack_intl (see tests/test_upi_vpa.py), so a change
              # there can change this job's result too.
              - 'packs/maskflow-pack-intl/**'
              - 'pyproject.toml'
            sdk_python:
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            gateway:
              - 'packages/maskflow-gateway/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            litellm_guardrail:
              - 'packages/maskflow-litellm/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            cli:
              - 'packages/maskflow-cli/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            cli_docker:
              - 'packages/maskflow-cli/Dockerfile'
              - 'packages/maskflow-cli/.dockerignore'
              - '.github/workflows/ci.yml'
            detection_js:
              - 'packages/maskflow-js/**'
            bench:
              - 'bench/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check packages/maskflow-core
      - run: uv run ruff format --check packages/maskflow-core
      - run: uv run mypy packages/maskflow-core --strict
      - run: >
          uv run pytest packages/maskflow-core/tests -q
          --cov=maskflow_core --cov-report=term-missing --cov-fail-under=85

  pack-intl:
    needs: changes
    if: needs.changes.outputs.pack_intl == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packs/maskflow-pack-intl
      - run: uv run ruff format --check packs/maskflow-pack-intl
      - run: uv run pytest packs/maskflow-pack-intl/tests -q

  pack-india:
    needs: changes
    if: needs.changes.outputs.pack_india == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # maskflow-pack-india has no [nlp] dependency of its own, but
      # detect() always runs the NER pass regardless of which pack
      # registered which pattern -- uv sync pulls maskflow-core[nlp]
      # transitively via maskflow-sdk, same as the pack-intl job above.
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packs/maskflow-pack-india
      - run: uv run ruff format --check packs/maskflow-pack-india
      - run: uv run pytest packs/maskflow-pack-india/tests -q

  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-sdk
      - run: uv run ruff format --check packages/maskflow-sdk
      - run: uv run pytest packages/maskflow-sdk/tests -q

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-gateway
      - run: uv run ruff format --check packages/maskflow-gateway
      - run: uv run pytest packages/maskflow-gateway/tests -q
      # Explicit rerun of the leak gate so a PII leak is an unmissable
      # distinct failure, same pattern as scan-fuzz.
      - run: uv run pytest packages/maskflow-gateway/tests -m leak -q

  litellm-guardrail:
    needs: changes
    if: needs.changes.outputs.litellm_guardrail == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --group litellm --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-litellm
      - run: uv run ruff format --check packages/maskflow-litellm
      # Provider-agnostic suites (litellm-free) + the real-base-class
      # integration suite (needs the litellm group).
      - run: uv run --group litellm pytest packages/maskflow-litellm/tests -q
      # Explicit rerun of the leak gate so a PII leak is an unmissable
      # distinct failure, same pattern as the gateway job.
      - run: uv run --group litellm pytest packages/maskflow-litellm/tests -m leak -q

  gateway-helm:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint packages/maskflow-gateway/deploy/helm/maskflow-gateway
      - name: Templates render with and without Redis
        run: |
          helm template t packages/maskflow-gateway/deploy/helm/maskflow-gateway \
            --set redis.url=redis://r:6379/0 --set sessionKey.value=$(printf 'ab%.0s' {1..32}) >/dev/null
          helm template t packages/maskflow-gateway/deploy/helm/maskflow-gateway \
            --set redis.url= --set replicaCount=1 --set autoscaling.enabled=false >/dev/null

  gateway-loadtest:
    # Throughput smoke: the gateway proxies a zero-latency upstream under a
    # short Locust run; fails only if it cannot clear a low floor, so a
    # future change that tanks throughput is caught. Not the published
    # table (see packages/maskflow-gateway/loadtest/README.md).
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run the load test against a mock upstream
        working-directory: packages/maskflow-gateway
        run: |
          uv run uvicorn loadtest.mock_upstream:app --port 9001 --log-level warning &
          MASKFLOW_GATEWAY_OPENAI_BASE_URL=http://127.0.0.1:9001/v1 \
          MASKFLOW_GATEWAY_NER=0 MASKFLOW_GATEWAY_JSON_LOGS=1 \
          uv run maskflow-gateway --port 8000 --workers 2 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          uv run --with locust locust -f loadtest/locustfile.py \
            --host http://127.0.0.1:8000 --headless -u 40 -r 20 -t 20s \
            --only-summary --exit-code-on-error 1 --csv gw

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-cli
      - run: uv run ruff format --check packages/maskflow-cli
      - run: uv run pytest packages/maskflow-cli/tests -q

  scan-fuzz:
    # Permanent fuzz gate for `maskflow scan`: generate a corpus of known
    # synthetic PII, render every report format, assert no raw value
    # survives anywhere in the output. Kept as a distinct required check
    # (not just folded into the `cli` job) so a leak is unmissable.
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packages/maskflow-cli/tests/scan -m leak -q

  scan-binary:
    # The standalone `maskflow` binary (PyInstaller, spaCy excluded). Guards
    # the spec / entry point / multiprocessing-freeze regression surface
    # without the full 3-OS release matrix on every PR.
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # From the local checkout -- its deps (core / packs / httpx) are all
      # on PyPI at compatible versions, only maskflow-cli itself is local.
      - run: pip install pyinstaller ./packages/maskflow-cli
      - run: pyinstaller --clean --noconfirm packages/maskflow-cli/packaging/maskflow.spec
      - name: Smoke test
        run: |
          dist/maskflow --help
          dist/maskflow scan jsonl packages/maskflow-cli/examples/sample-llm-traffic.jsonl \
            --field 'messages[].content' --provider-field provider --out /tmp/r.html --quiet
          grep -q "PII Exposure Scan" /tmp/r.html
          ! grep -Eq '\b19[0-9]{2}-[0-9]{2}-[0-9]{2}\b' /tmp/r.html
          dist/maskflow scan jsonl packages/maskflow-cli/examples/sample-llm-traffic.jsonl \
            --field 'messages[].content' --deep 2>&1 | grep -q "needs the NER pass"

  scan-docker:
    # Only when the Dockerfile itself changes -- the image installs
    # maskflow-cli from PyPI, so this validates the Dockerfile mechanics
    # (and the published CLI), not the PR's Python changes.
    needs: changes
    if: needs.changes.outputs.cli_docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/maskflow-cli/Dockerfile -t mf-cli-test packages/maskflow-cli
      - name: The image runs `maskflow scan`
        run: |
          docker run --rm mf-cli-test --help | grep -q "MaskFlow"
          docker run --rm mf-cli-test scan --help | grep -q "self-contained report"
          # Read-only mount; JSON to stdout so the container writes nothing.
          docker run --rm -v "$PWD/packages/maskflow-cli/examples:/work:ro" mf-cli-test \
            scan jsonl /work/sample-llm-traffic.jsonl \
            --field 'messages[].content' --provider-field provider \
            --service-field model --timestamp-field created_at --deep \
            --format json --out - --quiet > out.json
          python -c "import json; d=json.load(open('out.json')); assert d['headline_total']>100, d['headline_total']; assert any(r['entity_type']=='AADHAAR' for r in d['severity_rows'])"

  benchmark:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # Only ever needs the maskflow adapter -- no presidio/mask-privacy
      # install, no Anthropic key. See bench/indiapii/harness/tests/
      # test_ci_regression.py.
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest bench/indiapii/harness/tests -m benchmark -q
      # Pure/deterministic pieces only (task generation, scoring, cache,
      # pipeline masking against a fake model) -- no Anthropic key needed.
      # The live task-model/judge path (pipeline.py's TaskModel.generate(),
      # judge.py's Judge.score()) is exercised by a manual `run` invocation,
      # same as llm_adapter.py's own network call is never run in CI.
      - run: uv run pytest bench/indiapii/quality/tests -q

  detection-js:
    needs: changes
    if: needs.changes.outputs.detection_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -w @maskflow/detection
      - run: npm test -w @maskflow/detection

  pip-audit:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.pack_intl == 'true' || needs.changes.outputs.pack_india == 'true' || needs.changes.outputs.sdk_python == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv export --no-hashes --all-extras -o requirements.txt
      - run: uvx pip-audit -r requirements.txt
