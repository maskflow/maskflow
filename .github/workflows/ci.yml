name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      pack_intl: ${{ steps.filter.outputs.pack_intl }}
      pack_india: ${{ steps.filter.outputs.pack_india }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      evidence: ${{ steps.filter.outputs.evidence }}
      attest: ${{ steps.filter.outputs.attest }}
      agent: ${{ steps.filter.outputs.agent }}
      gateway: ${{ steps.filter.outputs.gateway }}
      litellm_guardrail: ${{ steps.filter.outputs.litellm_guardrail }}
      langchain: ${{ steps.filter.outputs.langchain }}
      llamaindex: ${{ steps.filter.outputs.llamaindex }}
      mcp: ${{ steps.filter.outputs.mcp }}
      cli: ${{ steps.filter.outputs.cli }}
      audit: ${{ steps.filter.outputs.audit }}
      cli_docker: ${{ steps.filter.outputs.cli_docker }}
      detection_js: ${{ steps.filter.outputs.detection_js }}
      bench: ${{ steps.filter.outputs.bench }}
      integration_parity: ${{ steps.filter.outputs.integration_parity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/maskflow-core/**'
              - 'pyproject.toml'
            pack_intl:
              - 'packs/maskflow-pack-intl/**'
              - 'packages/maskflow-core/**'
              - 'pyproject.toml'
            pack_india:
              - 'packs/maskflow-pack-india/**'
              - 'packages/maskflow-core/**'
              # pack-india's cross-pack UPI_VPA-vs-EMAIL test imports
              # maskflow_pack_intl (see tests/test_upi_vpa.py), so a change
              # there can change this job's result too.
              - 'packs/maskflow-pack-intl/**'
              - 'pyproject.toml'
            sdk_python:
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            evidence:
              - 'packages/maskflow-evidence/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            attest:
              - 'packages/maskflow-attest/**'
            agent:
              - 'packages/maskflow-agent/**'
              - 'plugins/maskflow-agent/**'
              - '.claude-plugin/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-india/**'
              - 'packages/maskflow-bench/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            gateway:
              - 'packages/maskflow-gateway/**'
              - 'packages/maskflow-evidence/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            litellm_guardrail:
              - 'packages/maskflow-litellm/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            langchain:
              - 'packages/maskflow-langchain/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            llamaindex:
              - 'packages/maskflow-llamaindex/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            mcp:
              - 'packages/maskflow-mcp/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            cli:
              - 'packages/maskflow-cli/**'
              - 'packages/maskflow-evidence/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            audit:
              - 'packages/maskflow-audit/**'
              - 'packages/maskflow-cli/**'
              - 'audit-fixtures/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            cli_docker:
              - 'packages/maskflow-cli/Dockerfile'
              - 'packages/maskflow-cli/.dockerignore'
              - '.github/workflows/ci.yml'
            detection_js:
              - 'packages/maskflow-js/**'
            bench:
              - 'bench/**'
              - 'audit-fixtures/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'
            integration_parity:
              - 'bench/integrations/**'
              - 'packages/maskflow-litellm/**'
              - 'packages/maskflow-langchain/**'
              - 'packages/maskflow-llamaindex/**'
              - 'packages/maskflow-mcp/**'
              - 'packages/maskflow-sdk/**'
              - 'packages/maskflow-core/**'
              - 'packs/maskflow-pack-intl/**'
              - 'packs/maskflow-pack-india/**'
              - 'pyproject.toml'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check packages/maskflow-core
      - run: uv run ruff format --check packages/maskflow-core
      - run: uv run mypy packages/maskflow-core --strict
      - run: >
          uv run pytest packages/maskflow-core/tests -q
          --cov=maskflow_core --cov-report=term-missing --cov-fail-under=85

  pack-intl:
    needs: changes
    if: needs.changes.outputs.pack_intl == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packs/maskflow-pack-intl
      - run: uv run ruff format --check packs/maskflow-pack-intl
      - run: uv run pytest packs/maskflow-pack-intl/tests -q

  pack-india:
    needs: changes
    if: needs.changes.outputs.pack_india == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # maskflow-pack-india has no [nlp] dependency of its own, but
      # detect() always runs the NER pass regardless of which pack
      # registered which pattern -- uv sync pulls maskflow-core[nlp]
      # transitively via maskflow-sdk, same as the pack-intl job above.
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packs/maskflow-pack-india
      - run: uv run ruff format --check packs/maskflow-pack-india
      - run: uv run pytest packs/maskflow-pack-india/tests -q

  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-sdk
      - run: uv run ruff format --check packages/maskflow-sdk
      - run: uv run pytest packages/maskflow-sdk/tests -q

  evidence:
    needs: changes
    if: needs.changes.outputs.evidence == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-evidence
      - run: uv run ruff format --check packages/maskflow-evidence
      - run: uv run mypy packages/maskflow-evidence/src --strict
      - run: uv run pytest packages/maskflow-evidence/tests -q
      # Explicit rerun of the metadata-only / leak gate as a distinct
      # failure -- the whole evidence layer rests on it (issue #41 DoD).
      - run: uv run pytest packages/maskflow-evidence/tests -m leak -q

  attest:
    needs: changes
    if: needs.changes.outputs.attest == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-attest
      - run: uv run ruff format --check packages/maskflow-attest
      - run: uv run mypy packages/maskflow-attest/src --strict
      - run: uv run pytest packages/maskflow-attest/tests -q

  agent:
    # Claude Code hook guard. Unix sockets only in v1, so no Windows leg.
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-agent
      - run: uv run ruff format --check packages/maskflow-agent
      - run: uv run mypy packages/maskflow-agent/src --strict
      - run: uv run pytest packages/maskflow-agent/tests -q
      - run: uv run pytest packages/maskflow-agent/tests -m leak -q

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-gateway
      - run: uv run ruff format --check packages/maskflow-gateway
      - run: uv run pytest packages/maskflow-gateway/tests -q
      # Explicit rerun of the leak gate so a PII leak is an unmissable
      # distinct failure, same pattern as scan-fuzz.
      - run: uv run pytest packages/maskflow-gateway/tests -m leak -q

  litellm-guardrail:
    needs: changes
    if: needs.changes.outputs.litellm_guardrail == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 floor: the current litellm release declares >=3.10 but imports
        # typing.NotRequired at module load, so it does not run on 3.10. The
        # provider-agnostic modules are covered on 3.10 by litellm-guardrail-core
        # below.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --group litellm --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-litellm
      - run: uv run ruff format --check packages/maskflow-litellm
      # Provider-agnostic suites (litellm-free) + the real-base-class
      # integration suite (needs the litellm group).
      - run: uv run --group litellm pytest packages/maskflow-litellm/tests -q
      # Explicit rerun of the leak gate so a PII leak is an unmissable
      # distinct failure, same pattern as the gateway job.
      - run: uv run --group litellm pytest packages/maskflow-litellm/tests -m leak -q

  litellm-guardrail-core:
    # The provider-agnostic modules (masking, streaming unmask, session stores)
    # on the full supported Python range, including 3.10. litellm is not
    # installed here, so test_litellm_guardrail.py importorskips and is skipped.
    needs: changes
    if: needs.changes.outputs.litellm_guardrail == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packages/maskflow-litellm/tests -q

  langchain:
    needs: changes
    if: needs.changes.outputs.langchain == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-langchain
      - run: uv run ruff format --check packages/maskflow-langchain
      - run: uv run pytest packages/maskflow-langchain/tests -q
      # Explicit rerun of the leak gate as a distinct failure.
      - run: uv run pytest packages/maskflow-langchain/tests -m leak -q

  llamaindex:
    needs: changes
    if: needs.changes.outputs.llamaindex == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --group llama-index --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-llamaindex
      - run: uv run ruff format --check packages/maskflow-llamaindex
      - run: uv run --group llama-index pytest packages/maskflow-llamaindex/tests -q
      # Explicit rerun of the leak gate as a distinct failure.
      - run: uv run --group llama-index pytest packages/maskflow-llamaindex/tests -m leak -q

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --group mcp --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-mcp
      - run: uv run ruff format --check packages/maskflow-mcp
      - run: uv run --group mcp pytest packages/maskflow-mcp/tests -q
      # Explicit rerun of the leak gate as a distinct failure.
      - run: uv run --group mcp pytest packages/maskflow-mcp/tests -m leak -q

  gateway-helm:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint packages/maskflow-gateway/deploy/helm/maskflow-gateway
      - name: Templates render with and without Redis
        run: |
          helm template t packages/maskflow-gateway/deploy/helm/maskflow-gateway \
            --set redis.url=redis://r:6379/0 --set sessionKey.value=$(printf 'ab%.0s' {1..32}) >/dev/null
          helm template t packages/maskflow-gateway/deploy/helm/maskflow-gateway \
            --set redis.url= --set replicaCount=1 --set autoscaling.enabled=false >/dev/null

  gateway-loadtest:
    # Throughput smoke: the gateway proxies a zero-latency upstream under a
    # short Locust run; fails only if it cannot clear a low floor, so a
    # future change that tanks throughput is caught. Not the published
    # table (see packages/maskflow-gateway/loadtest/README.md).
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run the load test against a mock upstream
        working-directory: packages/maskflow-gateway
        run: |
          uv run uvicorn loadtest.mock_upstream:app --port 9001 --log-level warning &
          MASKFLOW_GATEWAY_OPENAI_BASE_URL=http://127.0.0.1:9001/v1 \
          MASKFLOW_GATEWAY_NER=0 MASKFLOW_GATEWAY_JSON_LOGS=1 \
          uv run maskflow-gateway --port 8000 --workers 2 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          uv run --with locust locust -f loadtest/locustfile.py \
            --host http://127.0.0.1:8000 --headless -u 40 -r 20 -t 20s \
            --only-summary --exit-code-on-error 1 --csv gw

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-cli
      - run: uv run ruff format --check packages/maskflow-cli
      - run: uv run pytest packages/maskflow-cli/tests -q

  scan-fuzz:
    # Permanent fuzz gate for `maskflow scan`: generate a corpus of known
    # synthetic PII, render every report format, assert no raw value
    # survives anywhere in the output. Kept as a distinct required check
    # (not just folded into the `cli` job) so a leak is unmissable.
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packages/maskflow-cli/tests/scan -m leak -q

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      # Discovery is static (ast only), so no spaCy model is needed -- but
      # the shared venv imports both packs, and pack-india's NLP layer
      # expects the model to resolve, so install it as every other job does.
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check packages/maskflow-audit audit-fixtures
      - run: uv run ruff format --check packages/maskflow-audit audit-fixtures
      - run: uv run mypy packages/maskflow-audit/src --strict
      - run: uv run pytest packages/maskflow-audit/tests -q
      # The fixture apps are the published accuracy claim; run them through
      # the CLI surface too, not just the library API.
      - run: uv run pytest packages/maskflow-cli/tests/audit -q
      # And score them, so a drop in discovery recall fails the build
      # rather than quietly shipping a clean report for a leaking app.
      - run: uv run ruff check bench/auditbench
      - run: uv run ruff format --check bench/auditbench
      - run: uv run pytest bench/auditbench/tests -q

  audit-leak:
    # Permanent leak gate for `maskflow audit`: the audit READS somebody
    # else's source, which can contain real PII in a constant or a
    # docstring, and writes a document a DPO is expected to retain and
    # share. Seed a tree with synthetic identifiers in every awkward place
    # and assert none survives into any rendered format. A distinct
    # required check (not folded into `audit`) so a leak is unmissable --
    # same policy as scan-fuzz above.
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packages/maskflow-audit/tests -m leak -q

  scan-binary:
    # The standalone `maskflow` binary (PyInstaller, spaCy excluded). Guards
    # the spec / entry point / multiprocessing-freeze regression surface
    # without the full 3-OS release matrix on every PR.
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # From the local checkout -- its deps (core / packs / httpx) are all
      # on PyPI at compatible versions, only maskflow-cli itself is local.
      - run: pip install pyinstaller ./packages/maskflow-cli
      - run: pyinstaller --clean --noconfirm packages/maskflow-cli/packaging/maskflow.spec
      - name: Smoke test
        run: |
          dist/maskflow --help
          dist/maskflow scan jsonl packages/maskflow-cli/examples/sample-llm-traffic.jsonl \
            --field 'messages[].content' --provider-field provider --out /tmp/r.html --quiet
          grep -q "PII Exposure Scan" /tmp/r.html
          ! grep -Eq '\b19[0-9]{2}-[0-9]{2}-[0-9]{2}\b' /tmp/r.html
          dist/maskflow scan jsonl packages/maskflow-cli/examples/sample-llm-traffic.jsonl \
            --field 'messages[].content' --deep 2>&1 | grep -q "needs the NER pass"

  scan-docker:
    # Only when the Dockerfile itself changes -- the image installs
    # maskflow-cli from PyPI, so this validates the Dockerfile mechanics
    # (and the published CLI), not the PR's Python changes.
    needs: changes
    if: needs.changes.outputs.cli_docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/maskflow-cli/Dockerfile -t mf-cli-test packages/maskflow-cli
      - name: The image runs `maskflow scan`
        run: |
          docker run --rm mf-cli-test --help | grep -q "MaskFlow"
          docker run --rm mf-cli-test scan --help | grep -q "self-contained report"
          # Read-only mount; JSON to stdout so the container writes nothing.
          docker run --rm -v "$PWD/packages/maskflow-cli/examples:/work:ro" mf-cli-test \
            scan jsonl /work/sample-llm-traffic.jsonl \
            --field 'messages[].content' --provider-field provider \
            --service-field model --timestamp-field created_at --deep \
            --format json --out - --quiet > out.json
          python -c "import json; d=json.load(open('out.json')); assert d['headline_total']>100, d['headline_total']; assert any(r['entity_type']=='AADHAAR' for r in d['severity_rows'])"

  benchmark:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # Only ever needs the maskflow adapter -- no presidio/mask-privacy
      # install, no Anthropic key. See bench/indiapii/harness/tests/
      # test_ci_regression.py.
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check bench/intlpii bench/scanbench
      - run: uv run ruff format --check bench/intlpii bench/scanbench
      - run: uv run pytest bench/indiapii/harness/tests -m benchmark -q
      # intl harness: the F1 regression gate (-m benchmark, maskflow adapter
      # only) plus the generator-reproducibility / corpus-well-formedness
      # checks (no third-party adapter deps). Mirrors indiapii above.
      - run: uv run pytest bench/intlpii/harness/tests -q
      # scan-log harness: F1 regression gate + the scan-pipeline plumbing
      # check (both -m benchmark) + generator reproducibility + structural
      # checks. Runs the real maskflow-cli scan pipeline (workspace pkg).
      - run: uv run pytest bench/scanbench/harness/tests -q
      # tabular corpus (CSV/psql/mysql/markdown/sqlite tables): generator
      # reproducibility + the column-header-context F1 gate (-m benchmark).
      - run: uv run ruff check bench/tabular
      - run: uv run ruff format --check bench/tabular
      - run: uv run pytest bench/tabular/tests -q
      # Pure/deterministic pieces only (task generation, scoring, cache,
      # pipeline masking against a fake model) -- no Anthropic key needed.
      # The live task-model/judge path (pipeline.py's TaskModel.generate(),
      # judge.py's Judge.score()) is exercised by a manual `run` invocation,
      # same as llm_adapter.py's own network call is never run in CI.
      - run: uv run pytest bench/indiapii/quality/tests -q

  integration-parity:
    # bench/integrations: routes an indiapii-v1.0 subset through each of the
    # four framework integrations' masking layers and asserts the masked
    # (entity_type, value) set + round-trip + streaming reassembly are
    # identical to the core engine's. Needs all four integration groups (the
    # `benchmark` job deliberately stays lean), so it is its own job.
    needs: changes
    if: needs.changes.outputs.integration_parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --group litellm --group llama-index --group mcp
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run ruff check bench/integrations
      - run: uv run ruff format --check bench/integrations
      - run: uv run pytest bench/integrations/tests -q

  detection-js:
    needs: changes
    if: needs.changes.outputs.detection_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -w @maskflow/detection
      - run: npm test -w @maskflow/detection

  pip-audit:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.pack_intl == 'true' || needs.changes.outputs.pack_india == 'true' || needs.changes.outputs.sdk_python == 'true' || needs.changes.outputs.evidence == 'true' || needs.changes.outputs.attest == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv export --no-hashes --all-extras -o requirements.txt
      - run: uvx pip-audit -r requirements.txt
