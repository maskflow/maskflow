name: Release MCP Proxy

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch: {}  # manual re-run of the publish (e.g. MCP Registry retry)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing + MCP Registry OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group mcp
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run --group mcp pytest packages/maskflow-mcp/tests -q
      - run: uv build --package maskflow-mcp
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      # Publish the server entry to the official MCP Registry
      # (registry.modelcontextprotocol.io). OIDC auth -- no secret; the
      # `id-token: write` above is what it needs. Namespace io.github.maskflow/*
      # is granted because this workflow runs in the maskflow org's repo.
      # Verification: packages/maskflow-mcp/README.md carries the
      # `<!-- mcp-name: io.github.maskflow/mcp -->` marker, which becomes the
      # PyPI description.
      - name: Wait for the release on PyPI
        run: |
          v=$(uv run python -c "import tomllib;print(tomllib.load(open('packages/maskflow-mcp/pyproject.toml','rb'))['project']['version'])")
          echo "waiting for maskflow-mcp $v on PyPI"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/maskflow-mcp/$v/json" >/dev/null && exit 0
            echo "not on PyPI yet (attempt $i)"; sleep 20
          done
          echo "gave up waiting for PyPI"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        working-directory: packages/maskflow-mcp
        run: |
          "$GITHUB_WORKSPACE/mcp-publisher" login github-oidc
          "$GITHUB_WORKSPACE/mcp-publisher" publish
