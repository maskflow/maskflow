name: Release MCP Proxy

on:
  push:
    tags:
      - "mcp-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group mcp
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run --group mcp pytest packages/maskflow-mcp/tests -q
      - run: uv build --package maskflow-mcp
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
