name: Release CLI

on:
  push:
    tags:
      - "cli-py-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      # maskflow-cli pulls in maskflow-pack-intl, which requires
      # maskflow-core[nlp] -- same as the sdk/pack-intl release workflows.
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest packages/maskflow-cli/tests -q
      - run: uv build --package maskflow-cli
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  version:
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: echo "v=${GITHUB_REF_NAME#cli-py-v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the release to appear on PyPI
        run: |
          for i in $(seq 1 30); do
            if pip index versions maskflow-cli 2>/dev/null | grep -q "${{ needs.version.outputs.v }}"; then
              exit 0
            fi
            echo "maskflow-cli ${{ needs.version.outputs.v }} not on PyPI yet (attempt $i)"; sleep 20
          done
          echo "gave up waiting for PyPI"; exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/maskflow-cli
          file: packages/maskflow-cli/Dockerfile
          build-args: MASKFLOW_CLI_VERSION=${{ needs.version.outputs.v }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/maskflow/cli:${{ needs.version.outputs.v }}
            ghcr.io/maskflow/cli:latest

  binaries:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: maskflow-linux-x86_64
          - os: macos-latest
            asset: maskflow-macos-arm64
          - os: windows-latest
            asset: maskflow-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the release to appear on PyPI
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if pip index versions maskflow-cli 2>/dev/null | grep -q "${{ needs.version.outputs.v }}"; then
              exit 0
            fi
            echo "not on PyPI yet (attempt $i)"; sleep 20
          done
          exit 1
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "maskflow-cli==${{ needs.version.outputs.v }}"
      - shell: bash
        run: pyinstaller --clean --noconfirm packages/maskflow-cli/packaging/maskflow.spec
      - name: Smoke test (patterns-only -- the binary omits spaCy)
        shell: bash
        run: |
          BIN=dist/maskflow; [ "${{ runner.os }}" = "Windows" ] && BIN=dist/maskflow.exe
          "$BIN" --help
          "$BIN" scan jsonl packages/maskflow-cli/examples/sample-llm-traffic.jsonl \
            --field 'messages[].content' --out /tmp/r.html --quiet
          grep -q "PII Exposure Scan" /tmp/r.html
          ! grep -Eq '\b19[0-9]{2}-[0-9]{2}-[0-9]{2}\b' /tmp/r.html   # no raw DOB
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/maskflow.exe "out/${{ matrix.asset }}"
          else
            cp dist/maskflow "out/${{ matrix.asset }}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/${{ matrix.asset }}
          fail_on_unmatched_files: true
