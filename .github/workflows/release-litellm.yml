name: Release LiteLLM Guardrail

on:
  push:
    tags:
      - "litellm-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group litellm
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run --group litellm pytest packages/maskflow-litellm/tests -q
      - run: uv build --package maskflow-litellm
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
