name: Bug report
description: Something is broken (crash, wrong output, install/build issue) that isn't a detection accuracy problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. If this is about PII being missed or wrongly flagged, please use
        the **False negative** or **False positive** templates instead — they capture the details
        we need much better than this one.

        **Do not paste real PII anywhere in this report.** Use synthetic/fake data only.

  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: "maskflow-core / maskflow-sdk / @maskflow/detection"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. maskflow-core 0.1.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands to reproduce the issue. Use synthetic data only.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python/Node version, how installed (pip/uv/npm)"
    validations:
      required: false
