[project]
name = "maskflow-pack-intl"
version = "0.1.0"
description = "MaskFlow's original intl/US-shaped PII recognizers (email, phone, SSN, credit card, IP, AWS/API keys, JWT, IBAN, address, person name, date of birth)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # register_ner_recognizer() and the empty-by-default PATTERNS/NER_RECOGNIZERS
    # registry only exist from 0.2.0 -- this pack cannot register anything
    # against an older core.
    "maskflow-core[nlp]>=0.2.0,<0.3",
]

[tool.uv.sources]
maskflow-core = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_pack_intl"]
