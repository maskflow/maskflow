[project]
name = "maskflow-pack-intl"
version = "0.2.0"
description = "MaskFlow's original intl/US-shaped PII recognizers (email, phone, SSN, credit card, IP, AWS/API keys, JWT, IBAN, address, person name, date of birth)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # register_surrogate_generator()/SURROGATE_GENERATORS -- called
    # unconditionally at import time by this pack's Strategy.SURROGATE
    # generator registrations -- only exist from core 0.3.0. Importing
    # this pack against an older core raises ImportError immediately.
    "maskflow-core[nlp]>=0.3.0,<0.4",
]

[tool.uv.sources]
maskflow-core = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_pack_intl"]
