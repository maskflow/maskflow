[project]
name = "maskflow-pack-intl"
version = "0.3.2"
description = "MaskFlow's original intl/US-shaped PII recognizers (email, phone, SSN, credit card, IP, AWS/API keys, JWT, IBAN, address, person name, date of birth)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # This pack's __init__.py imports maskflow_core.recognizer (issue #21's
    # pluggable interface, from core 0.6.0) and, from 0.3.2,
    # maskflow_core.context.NEGATIVE_CONTEXT_KEYWORDS (the #63 suppression
    # hook, from core 0.8.0). Importing this pack against an older core
    # raises ImportError immediately, so the floor is 0.8.0.
    "maskflow-core[nlp]>=0.8.0,<0.9",
]

[project.entry-points."maskflow.recognizers"]
intl = "maskflow_pack_intl:load_recognizers"

[tool.uv.sources]
maskflow-core = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_pack_intl"]
