[project]
name = "maskflow-pack-india"
version = "0.1.0"
description = "MaskFlow's Indian PII recognizers (Aadhaar, PAN, GSTIN, IFSC, UPI VPA)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # register_pattern()'s validator/context_keywords kwargs are all this
    # pack needs -- no NER, so no maskflow-core[nlp] extra required (keeps
    # this pack spaCy-free and its own import cost near zero).
    "maskflow-core>=0.4.0,<0.5",
]

[tool.uv.sources]
maskflow-core = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_pack_india"]
