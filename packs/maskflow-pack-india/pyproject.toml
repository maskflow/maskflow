[project]
name = "maskflow-pack-india"
version = "0.3.0"
description = "MaskFlow's Indian PII recognizers (Aadhaar, PAN, GSTIN, IFSC, UPI VPA, mobile, PIN code, voter ID, passport, driving licence, vehicle registration, ABHA, bank account, PERSON_NAME, INDIAN_ADDRESS)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "maskflow-core[nlp]>=0.5.0,<0.6",
    # PERSON_NAME (Indian) / INDIAN_ADDRESS gazetteer matching (~115k names) --
    # linear-time multi-pattern search, never "a regex loop" (CLAUDE.md rule 3).
    "pyahocorasick>=2.0,<3",
]

[tool.uv.sources]
maskflow-core = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskflow_pack_india"]
